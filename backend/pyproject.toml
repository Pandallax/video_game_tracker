[project]
name = "video-game-tracker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]
import = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
